<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully suppress expected container reverse proxy WebSocket disconnect noise
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason && (reason.message || String(reason)) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <script>
      // Synchronously set initial dark/light theme before CSS renders to avoid flash
      (function() {
        try {
          var saved = localStorage.getItem('apnalocal_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
